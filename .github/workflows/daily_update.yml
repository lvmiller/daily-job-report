name: Daily Job Aggregator & Publisher

on:
  schedule:
    # Triggers every day at 07:00 UTC (02:00 AM Central Time)
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Setup Python Runtime Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install google-genai

      - name: Run Python Tests
        run: python -m unittest -v

      - name: Run Job Compiler
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: python update_jobs.py

      - name: Commit Updated Listings and Seen Registry
        run: |
          git config user.name "GitHub Automation Runner"
          git config user.email "runner@github.com"
          git add jobs.json jobs_history.json
          if ! git diff --cached --quiet; then
            git commit -m "Automated Sync: Compile daily real job listings"
            git push
          else
            echo "No listing changes to commit."
          fi
